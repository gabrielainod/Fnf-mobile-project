name: APK

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
    inputs:
      mode:
        description: 'full = APK completo | typecheck = só compila o Haxe (rápido)'
        type: choice
        options: [full, quick, typecheck]
        default: full

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LOGFILE: ${{ github.workspace }}/build.log
      TYPECHECK_ONLY: ${{ (inputs.mode == 'typecheck' || contains(github.event.head_commit.message, '[typecheck]')) && '1' || '0' }}
      QUICK: ${{ (inputs.mode == 'quick' || contains(github.event.head_commit.message, '[quick]')) && '1' || '0' }}
    steps:
      - uses: actions/checkout@v4

      - name: Iniciar log
        run: |
          : > build.log
          {
            echo "FNF Mobile — log de build"
            echo "run: ${{ github.run_number }} | commit: ${{ github.sha }} | modo: ${{ inputs.mode || 'full' }}"
            echo "início: $(date -u)"
          } >> build.log

      - name: JDK 8 (usado pelo build do jogo)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Android SDK + NDK r21e
        env:
          SKIP_NDK: ${{ env.TYPECHECK_ONLY == '1' && '1' || '0' }}
        run: bash tools/ci_android_sdk.sh >> "$LOGFILE" 2>&1

      - name: Haxe 4.2.5 + bibliotecas
        run: bash tools/setup_haxe.sh >> "$LOGFILE" 2>&1

      - name: Assets do FNF (Semanas 1-3)
        run: |
          if [ "$TYPECHECK_ONLY" = "1" ]; then
            # no typecheck os assets não são usados: só cria as pastas para o
            # Project.xml não reclamar (economiza ~1 min por iteração)
            mkdir -p assets/preload assets/songs assets/shared assets/week2 assets/week3 assets/fonts
            echo "==> typecheck: assets pulados (apenas pastas vazias)" >> "$LOGFILE"
          else
            bash tools/fetch_assets.sh >> "$LOGFILE" 2>&1
          fi

      - name: Ajustes no template Android do Lime
        run: bash tools/patch_lime_android.sh >> "$LOGFILE" 2>&1

      - name: Compilar
        id: build
        continue-on-error: true
        run: bash tools/ci_build.sh

      - name: Publicar relatório + release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci_report.sh
