name: APK

on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
    inputs:
      quick:
        description: 'Build rápido (somente arm64-v8a)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - name: JDK 8 (usado pelo build do jogo)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Android SDK + NDK r21e
        run: bash tools/ci_android_sdk.sh

      - name: Haxe 4.2.5 + bibliotecas
        run: bash tools/setup_haxe.sh

      - name: Assets do FNF (Semanas 1-3)
        run: bash tools/fetch_assets.sh

      - name: Ajustes no template Android do Lime
        run: bash tools/patch_lime_android.sh

      - name: Compilar APK
        id: build
        continue-on-error: true
        env:
          QUICK: ${{ (github.event.inputs.quick == 'true') && '1' || '0' }}
        run: bash tools/ci_build.sh

      - name: Publicar relatório + release
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash tools/ci_report.sh

      - name: Artefato do Actions
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fnf-mobile-apk
          path: |
            dist/*.apk
            report.txt
          if-no-files-found: warn
