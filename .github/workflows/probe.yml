name: probe
on:
  push:
    branches: ['arena/**']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ambiente
        run: |
          echo "== java =="; java -version 2>&1 | head -3
          echo "== ANDROID_HOME =="; echo "$ANDROID_HOME"; ls "$ANDROID_HOME" 2>/dev/null
          echo "== ndk =="; ls "$ANDROID_HOME/ndk" 2>/dev/null
          echo "== build-tools =="; ls "$ANDROID_HOME/build-tools" 2>/dev/null
          echo "== platforms =="; ls "$ANDROID_HOME/platforms" 2>/dev/null
          echo "== net dl.google =="; curl -sI https://dl.google.com | head -1
          echo "== net lib.haxe =="; curl -sI https://lib.haxe.org | head -1
          echo "== net maven =="; curl -sI https://repo1.maven.org | head -1
          echo "== net gradle =="; curl -sI https://services.gradle.org | head -1
          echo "== net github =="; curl -sI https://github.com | head -1
          echo "== hw =="; nproc; free -m | head -2; df -h / | tail -1
      - name: artifact test
        run: echo "artefato ok" > out.txt
      - uses: actions/upload-artifact@v4
        with:
          name: probe-artifact
          path: out.txt
      - name: release permission test
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create zz-probe-teste --title "probe" --notes "teste de permissao" out.txt && echo "RELEASE_OK" || echo "RELEASE_FAIL"
